<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,900;1,9..144,900&display=swap');
      html, body { margin: 0; padding: 0; }
      .fg {
        width: 1024px; height: 500px; box-sizing: border-box;
        background: #f4ead8; color: #1a1410;
        display: flex; align-items: center; gap: 60px; padding: 0 100px;
        font-family: 'Fraunces', Georgia, serif;
      }
      .stamp {
        flex: 0 0 auto; width: 300px; height: 300px;
        background: #fbf4e2; border: 10px solid #1a1410; border-radius: 64px;
        display: flex; align-items: center; justify-content: center;
      }
      .stamp span { font-weight: 900; font-size: 210px; line-height: 1; }
      .ink { color: #1a1410; }
      .acc { color: #d94f2a; font-style: italic; }
      .word { font-weight: 900; font-size: 152px; line-height: 1; letter-spacing: -2px; }
      .tag { font-size: 40px; font-style: italic; margin-top: 20px; }
      .text { display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <div class="fg">
      <div class="stamp"><span><span class="ink">T</span><span class="acc">a</span></span></div>
      <div class="text">
        <div class="word"><span class="ink">T</span><span class="acc">a</span><span class="ink">ndu</span></div>
        <div class="tag">Fun things to do with the kids</div>
      </div>
    </div>
  </body>
</html>
